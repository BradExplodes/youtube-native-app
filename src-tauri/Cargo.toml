[package]
name = "youtube-music-native"
version = "0.1.0"
description = "Lightweight YouTube Music desktop client"
authors = ["BradExplodes"]
license = "MIT"
repository = "https://github.com/BradExplodes/youtube-native-app"
edition = "2024"

# See more keys and their definitions at https://doc.rust-lang.org/cargo/reference/manifest.html

[lib]
# The `_lib` suffix may seem redundant but it is necessary
# to make the lib name unique and wouldn't conflict with the bin name.
# This seems to be only an issue on Windows, see https://github.com/rust-lang/cargo/issues/8519
name = "ytm_native_lib"
crate-type = ["staticlib", "cdylib", "rlib"]

[build-dependencies]
tauri-build = { version = "2", features = [] }

[dependencies]
tauri = { version = "2", features = [] }
serde = { version = "1", features = ["derive"] }
serde_json = "1"
tokio = { version = "1", features = ["sync", "time"] }
tauri-plugin-log = "2"
tauri-plugin-window-state = "2"
tauri-plugin-updater = "2"
log = "0.4"

[target.'cfg(windows)'.dependencies]
souvlaki = "0.9"
# Same versions as Tauri uses, for WebView2 memory hints (webview.rs).
webview2-com = "0.39"
windows = { version = "0.62", features = ["Win32_Foundation", "Win32_UI_Shell", "Win32_UI_WindowsAndMessaging", "Win32_Graphics_Gdi", "Win32_System_Com", "Win32_UI_HiDpi"] }
windows-core = "0.62"


# Read the optimization guideline for more details: https://tauri.app/concept/size/#cargo-configuration
[profile.release]
codegen-units = 1
lto = true
opt-level = 3
panic = "abort"
strip = true
